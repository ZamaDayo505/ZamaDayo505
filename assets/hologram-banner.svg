<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c1024" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <radialGradient id="holoGlow" cx="425" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070913" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="holoBeam" x1="425" y1="240" x2="425" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes spinCw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCcw {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-40px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(270px); opacity: 0; }
      }
      @keyframes holoFlicker {
        0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 8px rgba(0,240,255,0.6)); }
        19% { opacity: 0.95; }
        20% { opacity: 0.65; transform: translate(-1.5px, 0.5px); }
        21% { opacity: 0.95; transform: translate(0, 0); }
        63% { opacity: 0.95; }
        64% { opacity: 0.7; transform: translate(1.5px, -0.5px); }
        65% { opacity: 0.95; transform: translate(0, 0); }
        87% { opacity: 0.95; }
        88% { opacity: 0.8; }
        89% { opacity: 0.95; }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.35; transform: scaleY(0.98); }
        50% { opacity: 0.65; transform: scaleY(1.02); }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes waveBar {
        0%, 100% { height: 4px; y: 15px; }
        50% { height: 16px; y: 3px; }
      }

      .rot-cw-left { transform-origin: 105px 125px; animation: spinCw 16s linear infinite; }
      .rot-ccw-left { transform-origin: 105px 125px; animation: spinCcw 24s linear infinite; }
      .rot-cw-right { transform-origin: 745px 125px; animation: spinCw 18s linear infinite; }
      .rot-ccw-right { transform-origin: 745px 125px; animation: spinCcw 28s linear infinite; }
      .holo-figure { animation: holoFlicker 4s ease-in-out infinite; transform-origin: center; }
      .beam-pulse { animation: pulseBeam 3s ease-in-out infinite; transform-origin: 425px 235px; }
      .scan-line { animation: scanSweep 3.5s linear infinite; }

      .tech-font {
        font-family: 'SF Mono', 'Courier New', Monaco, Consolas, monospace;
        letter-spacing: 1.5px;
      }
      .title-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 3px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="260" rx="16" fill="url(#bgGrad)" stroke="#1a233d" stroke-width="1.5" />

  <!-- Cyber Grid Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="65" x2="850" y2="65" />
    <line x1="0" y1="130" x2="850" y2="130" />
    <line x1="0" y1="195" x2="850" y2="195" />
    <line x1="170" y1="0" x2="170" y2="260" />
    <line x1="340" y1="0" x2="340" y2="260" />
    <line x1="510" y1="0" x2="510" y2="260" />
    <line x1="680" y1="0" x2="680" y2="260" />
  </g>

  <!-- Holographic Beam & Pedestal Glow -->
  <circle cx="425" cy="150" r="210" fill="url(#holoGlow)" />
  <polygon class="beam-pulse" points="360,240 490,240 540,25 310,25" fill="url(#holoBeam)" />

  <!-- Hologram Projector Pedestal -->
  <ellipse cx="425" cy="238" rx="85" ry="12" fill="#0b1329" stroke="#00f0ff" stroke-width="1.5" filter="url(#neonGlow)" />
  <ellipse cx="425" cy="238" rx="60" ry="7" fill="none" stroke="#d946ef" stroke-width="1" stroke-dasharray="6,4" />
  <ellipse cx="425" cy="238" rx="30" ry="3.5" fill="#00f0ff" filter="url(#softGlow)" />

  <!-- LEFT HUD: Hologram Diagnostic Interface -->
  <g class="rot-cw-left" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" fill="none">
    <circle cx="105" cy="125" r="58" stroke-dasharray="12, 6, 4, 6" />
    <circle cx="105" cy="125" r="42" stroke-dasharray="6, 8" stroke="#d946ef" />
  </g>
  <g class="rot-ccw-left" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" fill="none">
    <circle cx="105" cy="125" r="50" stroke-dasharray="2, 6" />
    <circle cx="105" cy="125" r="32" stroke="#00f0ff" stroke-opacity="0.5" />
    <line x1="105" y1="70" x2="105" y2="180" stroke-opacity="0.2" />
    <line x1="50" y1="125" x2="160" y2="125" stroke-opacity="0.2" />
  </g>
  <circle cx="105" cy="125" r="4" fill="#00f0ff" filter="url(#neonGlow)" />

  <!-- Left Telemetry Text -->
  <g class="tech-font" fill="#00f0ff" fill-opacity="0.7" font-size="9">
    <text x="24" y="32">◈ SYS_LINK // HOLO-NET</text>
    <text x="24" y="46" fill="#818cf8">NODE: 0x505 // ONLINE</text>
    <text x="24" y="218" fill="#64748b">SYNC_RATE: 99.4%</text>
    <text x="24" y="232" fill="#d946ef">CYBER_CORE // ACTIVE</text>
  </g>

  <!-- RIGHT HUD: Hologram Scanner & Radar -->
  <g class="rot-cw-right" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" fill="none">
    <circle cx="745" cy="125" r="58" stroke-dasharray="16, 8" />
    <circle cx="745" cy="125" r="44" stroke="#d946ef" stroke-dasharray="8, 6" />
  </g>
  <g class="rot-ccw-right" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" fill="none">
    <circle cx="745" cy="125" r="50" stroke-dasharray="4, 4" />
    <circle cx="745" cy="125" r="30" stroke="#00f0ff" />
    <line x1="745" y1="70" x2="745" y2="180" stroke-opacity="0.2" />
    <line x1="690" y1="125" x2="800" y2="125" stroke-opacity="0.2" />
  </g>
  <circle cx="745" cy="125" r="4" fill="#d946ef" filter="url(#neonGlow)" />

  <!-- Right Telemetry Text -->
  <g class="tech-font" fill="#00f0ff" fill-opacity="0.7" font-size="9" text-anchor="end">
    <text x="826" y="32">PROTOCOL: NEURAL_HUD ◈</text>
    <text x="826" y="46" fill="#818cf8">FREQ: 142.8 MHz</text>
    <text x="826" y="218" fill="#64748b">RENDER: 60 FPS</text>
    <text x="826" y="232" fill="#00f0ff">TARGET_LOCK: CONFIRMED</text>
  </g>

  <!-- CENTER: ANIME HOLOGRAM CHARACTER SILHOUETTE & AURA -->
  <g class="holo-figure">
    <!-- Hologram Aura Glow -->
    <path d="M 370 230 C 370 190, 385 160, 395 140 C 390 135, 385 125, 385 110 C 385 90, 400 75, 425 75 C 450 75, 465 90, 465 110 C 465 125, 460 135, 455 140 C 465 160, 480 190, 480 230 Z"
          fill="none" stroke="#00f0ff" stroke-width="6" opacity="0.2" filter="url(#softGlow)" />

    <!-- Anime Head / Hair Silhouette -->
    <!-- Back Hair Flare -->
    <path d="M 388 115 C 375 130, 365 155, 362 178 C 372 165, 382 150, 388 135 Z" fill="url(#cyanPurple)" opacity="0.6" />
    <path d="M 462 115 C 475 130, 485 155, 488 178 C 478 165, 468 150, 462 135 Z" fill="url(#cyanPurple)" opacity="0.6" />

    <!-- Shoulders / Cyber Suit Collar -->
    <path d="M 370 232 C 372 195, 392 170, 405 155 L 425 165 L 445 155 C 458 170, 478 195, 480 232 Z"
          fill="#0c1630" stroke="#00f0ff" stroke-width="1.8" filter="url(#neonGlow)" />

    <!-- Cyber Neck & Core Light -->
    <rect x="418" y="145" width="14" height="15" fill="#00f0ff" opacity="0.3" />
    <line x1="412" y1="175" x2="438" y2="175" stroke="#d946ef" stroke-width="2" />
    <circle cx="425" cy="192" r="5" fill="#00f0ff" filter="url(#neonGlow)" />
    <line x1="425" y1="197" x2="425" y2="225" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Face Silhouette -->
    <path d="M 405 115 C 405 140, 415 152, 425 152 C 435 152, 445 140, 445 115 Z" fill="#091124" stroke="#00f0ff" stroke-width="1.2" />

    <!-- Anime Hair Strands & Bangs -->
    <path d="M 390 108 C 388 85, 408 72, 425 72 C 442 72, 462 85, 460 108 C 452 98, 444 95, 436 102 C 430 92, 420 92, 414 102 C 406 95, 398 98, 390 108 Z"
          fill="#0d1b38" stroke="#00f0ff" stroke-width="1.8" />
    
    <!-- Spiky Anime Hair Accents -->
    <path d="M 405 76 C 395 62, 382 72, 392 88 Z" fill="url(#cyanPurple)" opacity="0.8" />
    <path d="M 425 72 C 424 54, 436 58, 432 74 Z" fill="url(#cyanPurple)" opacity="0.8" />
    <path d="M 445 76 C 455 62, 468 72, 458 88 Z" fill="url(#cyanPurple)" opacity="0.8" />

    <!-- Cyber Headset / Visor (Hologram Glow) -->
    <path d="M 398 112 Q 425 118 452 112" stroke="#00f0ff" stroke-width="3" fill="none" filter="url(#neonGlow)" />
    <ellipse cx="396" cy="113" rx="5" ry="8" fill="#d946ef" filter="url(#neonGlow)" />
    <ellipse cx="454" cy="113" rx="5" ry="8" fill="#d946ef" filter="url(#neonGlow)" />
    <!-- Visor Eye Glow -->
    <rect x="412" y="110" width="10" height="3" rx="1.5" fill="#ffffff" filter="url(#neonGlow)" />
    <rect x="428" y="110" width="10" height="3" rx="1.5" fill="#ffffff" filter="url(#neonGlow)" />

    <!-- Holographic Projection Scanline Overlay (Across Figure) -->
    <g stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1">
      <line x1="365" y1="85" x2="485" y2="85" />
      <line x1="365" y1="100" x2="485" y2="100" />
      <line x1="365" y1="115" x2="485" y2="115" />
      <line x1="365" y1="130" x2="485" y2="130" />
      <line x1="365" y1="145" x2="485" y2="145" />
      <line x1="365" y1="160" x2="485" y2="160" />
      <line x1="365" y1="175" x2="485" y2="175" />
      <line x1="365" y1="190" x2="485" y2="190" />
      <line x1="365" y1="205" x2="485" y2="205" />
      <line x1="365" y1="220" x2="485" y2="220" />
    </g>
  </g>

  <!-- Animated Sweeping Scan Beam -->
  <line class="scan-line" x1="280" y1="0" x2="570" y2="0" stroke="url(#cyanPurple)" stroke-width="2.5" filter="url(#neonGlow)" />

  <!-- Holographic Floating Tag Above Figure -->
  <g class="tech-font" text-anchor="middle">
    <rect x="365" y="24" width="120" height="18" rx="9" fill="#0b1329" stroke="#00f0ff" stroke-width="1" />
    <text x="425" y="36" fill="#00f0ff" font-size="9" font-weight="700">✦ HOLO_ENTITY ✦</text>
  </g>

  <!-- Cyberpunk Frame Accents (Corners) -->
  <g stroke="#00f0ff" stroke-width="2" fill="none">
    <path d="M 12 28 L 12 12 L 28 12" />
    <path d="M 838 28 L 838 12 L 822 12" />
    <path d="M 12 232 L 12 248 L 28 248" />
    <path d="M 838 232 L 838 248 L 822 248" />
  </g>

  <!-- Glowing Title at Bottom Center of Banner -->
  <g class="title-font" text-anchor="middle">
    <text x="425" y="210" fill="#ffffff" font-size="16" filter="url(#neonGlow)">ANGGI // ZAMADAYO505</text>
    <text x="425" y="226" fill="#00f0ff" font-size="9" letter-spacing="4px" font-family="'SF Mono', Monaco, monospace">SOFTWARE EXPLORER • ANIME AESTHETIC</text>
  </g>
</svg>